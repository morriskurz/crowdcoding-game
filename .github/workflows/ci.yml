name: ci
# Untrusted: runs agent code from any branch. Must never reference secrets or an environment.
# Deploys live only in deploy.yml (main, Environment "live"). Spec §8, B2e.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guard-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/guard.mjs
      - run: pnpm -r check
      - run: pnpm -r test
      - run: pnpm --filter @tcg/client build

  # Required status check: agent branches may not touch .github/**.
  # Deleting this job does not help: a required check that never reports blocks the merge.
  no-github-changes:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: fail if .github/** changed vs main
        run: |
          changed=$(git diff --name-only origin/main...HEAD -- .github)
          if [ -n "$changed" ]; then
            echo "Branch changes protected files:"
            echo "$changed"
            exit 1
          fi
          echo "no .github changes"
